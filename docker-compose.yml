version: '3.8'

services:
  db:
    image: postgres:15
    container_name: typing_postgres
    restart: always
    environment:
      POSTGRES_DB: typing_app
      POSTGRES_USER: typing_user
      POSTGRES_PASSWORD: securepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: typing_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://typing_user:securepass@db:5432/typing_app
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local
    name: touch-type-engine_postgres_data